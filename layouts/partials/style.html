<style>
/* ============================================================
   CSV.MICRO.BLOG — CONSOLIDATED STYLESHEET
   ============================================================ */

/* --- VARIABLES (LIGHT) ---------------------------------------- */

:root {
  --black: black;
  --superdarkgrey: #050505;
  --darkgrey: #101010;
  --grey: #505050;
  --medgrey: #696969;
  --lightgrey: #B0B0B0;
  --silver: silver;
  --whitesmoke: #f2f2f2;
  --white: white;
  --highlighter: #e2d303;
  --eblue: #0033cc;
  --ebluelight: #3385ff;
 	
  --timestamp-width: 108px;

  --color-bg:          		var(--white);
  --color-text:        		var(--grey);
  --color-heading:     		var(--darkgrey);
  --color-link:        		var(--eblue);
  --color-link-hover:  		var(--eblue);
  --color-visited:     		var(--eblue);
  --color-brand-bg:    		var(--highlighter);
  
  --color-title:           	var(--darkgrey);
  --color-title-hover:   	var(--darkgrey);
  --color-nav:   			var(--eblue);
  --color-nav-hover:  		var(--eblue);
  
  --color-post-title:  		var(--darkgrey);
  --color-post-hover:  		var(--superdarkgrey);
  
  --color-timestamp:   		var(--lightgrey);
  --color-timestamp-hover: 	var(--grey);
  
  --color-sup-text:  		var(--grey);
  
  --color-code-bg:     #f2f2f2;
  --color-quote-border:#999;
  --color-quote-text:  #222;
  --color-helptext:    #777;
  --color-error:       #eba613;
  --color-microblog-border: #444;
  --color-microblog-time:   #444;

  --font-family:       monospace;
  --max-width:         850px;
  --mobile-breakpoint: 749px;
}

/* --- VARIABLES (DARK) ----------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg:          var(--superdarkgrey);
    --color-text:        var(--whitesmoke);
    --color-heading:     var(--white);
    --color-link:        var(--eblue);
    --color-link-hover:  var(--eblue);
    --color-visited:     var(--eblue);
  
	  
  	--color-title:           	var(--white);
 	--color-title-hover:   		var(--white);
 	--color-nav:   				var(--eblue);
 	--color-nav-hover:  		var(--eblue);
  
 	--color-post-title:  		var(--lightgrey);
  	--color-post-hover:  		var(--whitesmoke);
  
  	--color-timestamp:   		var(--medgrey);
  	--color-timestamp-hover: 	var(--lightgrey);
  
  	--color-sup-text:  			var(--medgrey);
	
    
    --color-code-bg:     #222;
    --color-quote-border:#666;
    --color-quote-text:  #ccc;
    --color-helptext:    #aaa;
    --color-microblog-border: #ddd;
    --color-microblog-time:   #ddd;
  }
}

/* --- BASE / RESET --------------------------------------------- */
body {
  font-family:     monospace;
  margin:          auto;
  padding:         20px 20px 0;
  max-width:       var(--max-width);
  min-height:      100vh;
  display:         flex;
  flex-direction:  column;
  text-align:      left;
  background-color:var(--color-bg);
  color:           var(--color-text);
  word-wrap:       break-word;
  overflow-wrap:   break-word;
  line-height:     1.5;
}

h1, h2, h3, h4, h5, h6, strong, b {
  color: var(--color-heading);
}

a {
  color:           var(--color-link);
  text-decoration: none;
}
a:hover {
  color:           var(--color-link-hover);
  text-decoration: underline;
}
a:visited {
  color: var(--color-visited);
}

img, video {
  max-width: 100%;
  height:    auto;
}

textarea {
  width:     100%;
  font-size: 13px;
}
input {
  font-size: 13px;
}

/* --- HEADER --------------------------------------------------- */
.made-with {
  display: none;
}

header {
  display:        block;
  border-bottom:  0;
  padding-bottom: 8px;
  margin-left:    var(--timestamp-width);
  background-color: var(--color-bg);
}

.title {
	margin-left: 0;
	border: 0;
}
.title h2 {
  margin-bottom:  0;
  white-space:    nowrap;
  font-weight:    525;
  color: 		  var(--color-title);
  font-size: 	  17px;
}
.title h2 a:hover {
	text-decoration: none;
}

a.title:hover {
	text-decoration: none !important;
}

nav a {
  margin-right: 7px;
  font-size:    15px;
  font-style:   none;
  color:        var(--color-nav);
}

nav a:hover {
	text-decoration: underline;
	color: var(--color-nav-hover);
}

/* --- MAIN / FOOTER -------------------------------------------- */
main {
  margin-top: 15px;
  flex:       1;
  background-color: var(--color-bg);
}
.h-entry {
	border-top: .75px solid var(--color-timestamp);
}

.h-entry .p-name .u-url {
	margin: 1.5rem 0;
}

footer {
  padding:    25px;
  height:     50px;
  background-color: var(--color-bg);
  display: flex;
  align-items: middle;
  justify-content: right;
}

.footer-title {
	font-size: 16px;
	font-weight: 600;
	margin-right: 1.5rem;
}

.footer-title:hover {
	text-decoration: none;
}

.footer-nav {
	font-size: 16px;
	text-transform: uppercase;
	font-weight: 400;
}


/* --- CODE ---------------------------------------------------- */
code {
  padding:          2px 5px;
  background-color: var(--color-code-bg);
}
pre code {
  color:            var(--color-text);
  display:          block;
  padding:          20px;
  white-space:      pre-wrap;
  font-size:        14px;
  overflow-x:       auto;
  background-color: var(--color-code-bg);
}
div.highlight pre {
  background-color: initial;
  color:            initial;
}
div.highlight code {
  background-color: unset;
  color:            unset;
}


/* --- BLOCKQUOTE ---------------------------------------------- */
blockquote {
  border-left: 1px solid var(--color-quote-border);
  color:       var(--color-quote-text);
  padding-left: 20px;
  font-style:  italic;
}


/* --- CHANGELOG TABLE ----------------------------------------- */
table.changelog {
  width:           100%;
  border-collapse: collapse;
}
table.changelog tr {
  border-bottom: .75px solid var(--color-timestamp);
}
table.changelog td {
  padding:        0.5rem;
  vertical-align: middle;
}
table.changelog td.timestamp {
  width:       var(--timestamp-width);
  white-space: nowrap;
}
table.changelog td.timestamp a {
  font-size:   14px;
  font-weight: 400;
  color:       var(--color-timestamp);
  text-decoration: none;
}
table.changelog td.timestamp a:hover {
  color:       var(--color-timestamp-hover);
  text-decoration: none;
  font-weight: 400;
}
table.changelog td.post-title {
	max-width: auto;
	white-space: nowrap;
}
table.changelog td.post-title a {
  text-decoration: none;
  font-size:       14px;
  color:           var(--color-post-title);
  font-weight:     500;
  text-transform:  uppercase;
}
table.changelog td.post-title a:hover {
  font-weight:     550;
  color:           var(--color-post-hover);
  text-decoration: underline;
}
.sup-text-mobile {
	display: none;
}
.changelog .sup-text {
  width: 100%;
  font-size: 13px;
  font-style: italic;
  color: var(--color-sup-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-left: .75rem;
  max-width: 0;
  font-weight: 400 !important;
}

/* --- STATIC PAGES -------------------------------------------- */
/* single post: remove header indent */
@media (min-width: 750px) {
  body:not(:has(.changelog)) header {
    margin-left: 0;
	}
}



/* --- MICROBLOG CONVERSATION ---------------------------------- */
.microblog_conversation {
  margin-top:  50px;
  padding-top: 20px;
  border-top:  1px dashed var(--color-microblog-border);
}
.microblog_post {
  padding-top:    20px;
  padding-bottom: 20px;
}
.microblog_avatar {
  border-radius:  10px;
  vertical-align: top;
}
.microblog_time {
  font-size:  13px;
  padding-top:10px;
}
.microblog_time a {
  color:           var(--color-microblog-time);
  text-decoration: none;
}


/* --- UTILITY ------------------------------------------------- */
.helptext {
  color:     var(--color-helptext);
  font-size: small;
}
.errorlist {
  color:     var(--color-error);
  font-size: small;
}

/* --- BLOG POSTS (legacy — may be unused if changelog replaced) */
/*
ul.blog-posts {
  list-style-type: none;
  padding:         unset;
}
ul.blog-posts li {
  display: flex;
}
ul.blog-posts li span {
  flex: 0 0 130px;
}
ul.blog-posts li a:visited {
  color: var(--color-visited);
}
*/



/* --- MOBILE -------------------------------------------------- */
@media (max-width: 749px) {
  :root {
    --timestamp-width: 0px;
  }
  header {
    margin-left: 0;
  }
  .title {
	  font-size: 18px;
  }
  nav {
    margin-left: 0;
  }
  footer {
	  padding-left: 0 !important;
	  margin-left: 0;
  }
  .footer {
	  padding-left: 0 !important;
  }
  
  table.changelog {
    display: block;
	width: 100%;
  }
  
  table.changelog tr {
  border-bottom: 0;
  }
  
  table.changelog td {
    display: block;
    padding: 0;
	margin: 4px 0 2px;
  }
  table.changelog td.timestamp { 
	margin-top: 1rem;
  }
  
  table.changelog td.timestamp a {
    font-size:    11.5px;  
	margin-top: 1rem;
  }
  table.changelog td.post-title {
    margin: 2px 0 4px;
	width: 100%;
  }
  .sup-text-desktop {
	display: none;
  }
  .sup-text-mobile {
	display: inline;
	white-space: wrap;
	padding-left: 0;
  }
  table.changelog .sup-text {
	  max-width: none;
	  width: 100%;
	  padding-left: 0 !important;
	  font-size: 12px;
	  line-height: 1.5;
	  margin-bottom: 1rem;
  }
  footer {
	  justify-content: left;
	  padding-left: 0;
  }
  .footer-title {
	  margin-left: 0;
	  font-size: 13px;
  }
  .footer-nav {
	  font-size: 13px;
  }
}

</style>
